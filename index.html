<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Tanishqa AI 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      margin: 32px 16px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2937;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span.logo {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #22c55e, #0ea5e9);
      display: inline-block;
    }
    #chat {
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 12px;
      min-height: 220px;
      max-height: 420px;
      overflow-y: auto;
      background: #020617;
    }
    .message {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
    }
    .bubble {
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user .bubble {
      background: #1d4ed8;
      align-self: flex-end;
      margin-left: auto;
    }
    .assistant .bubble {
      background: #111827;
      border: 1px solid #1f2937;
      align-self: flex-start;
      margin-right: auto;
    }
    .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    form {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #374151;
      padding: 10px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 70px;
      background: #020617;
      color: #e5e7eb;
    }
    textarea:focus {
      outline: 1px solid #3b82f6;
      border-color: #3b82f6;
    }
    button {
      align-self: flex-end;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 6px;
      min-height: 16px;
    }
    .footer-note {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #6b7280;
    }
    @media (max-width: 600px) {
      .container {
        margin: 16px 8px;
        padding: 16px;
      }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="logo"></span> My ChatGPT Site</h1>
    <p style="font-size:0.9rem;color:#9ca3af;margin-top:4px;">
      Type a question below and the AI will answer directly on this page.
    </p>

    <div id="chat"></div>

    <form id="chat-form">
      <label for="question" style="font-size:0.85rem;color:#9ca3af;">Your question</label>
      <textarea id="question" placeholder="Ask anything..."></textarea>
      <button type="submit">Send</button>
      <div id="status"></div>
      <div class="footer-note">
        Uses the OpenAI Chat Completions API (ChatGPT model). Don’t expose real keys in production.
      </div>
    </form>
  </div>

  <script>
    // 🔑 Replace this with your real OpenAI API key
    const API_KEY = "YOUR_OPENAI_API_KEY_HERE";

    const chatDiv = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const statusDiv = document.getElementById("status");
    const sendButton = form.querySelector("button");

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "message " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const roleLabel = document.createElement("div");
      roleLabel.className = "role";
      roleLabel.textContent = role === "user" ? "You" : "Assistant";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.appendChild(roleLabel);
      bubble.appendChild(content);
      wrapper.appendChild(bubble);
      chatDiv.appendChild(wrapper);

      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function askChatGPT(question) {
      statusDiv.textContent = "Thinking...";
      sendButton.disabled = true;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "You are a helpful assistant answering questions on a personal website." },
              { role: "user", content: question }
            ]
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error("API error:", errorText);
          throw new Error("API request failed");
        }

        const data = await response.json();
        const answer = data.choices[0].message.content;
        return answer;
      } catch (err) {
        console.error(err);
        return "Sorry, something went wrong talking to the AI.";
      } finally {
        statusDiv.textContent = "";
        sendButton.disabled = false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      addMessage("user", question);
      questionInput.value = "";

      const answer = await askChatGPT(question);
      addMessage("assistant", answer);
    });
  </script>
</body>
</html>
